name: "Phase 5 - CD (Build & Deploy to Oracle OKE)"

on:
  push:
    branches: [main]
    paths:
      - "phase5/**"

env:
  OCI_REGION: ${{ secrets.OCI_REGION }}
  OCI_TENANCY_NAMESPACE: ${{ secrets.OCI_TENANCY_NAMESPACE }}
  IMAGE_TAG: "5.0.0-${{ github.sha }}"

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Oracle OCIR
        run: |
          echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login \
            ${{ env.OCI_REGION }}.ocir.io \
            -u "${{ env.OCI_TENANCY_NAMESPACE }}/${{ secrets.OCI_USERNAME }}" \
            --password-stdin

      - name: Build and Push Backend
        run: |
          docker build -t ${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-backend:${{ env.IMAGE_TAG }} ./phase5/backend/
          docker push ${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-backend:${{ env.IMAGE_TAG }}

      - name: Build and Push Frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ secrets.BACKEND_URL }}" \
            --build-arg NEXT_PUBLIC_OPENAI_DOMAIN_KEY="${{ secrets.OPENAI_DOMAIN_KEY }}" \
            -t ${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-frontend:${{ env.IMAGE_TAG }} \
            ./phase5/frontend/
          docker push ${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-frontend:${{ env.IMAGE_TAG }}

      - name: Build and Push Notification Service
        run: |
          docker build -t ${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-notification:${{ env.IMAGE_TAG }} ./phase5/notification-service/
          docker push ${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-notification:${{ env.IMAGE_TAG }}

      - name: Build and Push Recurring Task Service
        run: |
          docker build -t ${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-recurring:${{ env.IMAGE_TAG }} ./phase5/recurring-task-service/
          docker push ${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-recurring:${{ env.IMAGE_TAG }}

      - name: Build and Push Audit Service
        run: |
          docker build -t ${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-audit:${{ env.IMAGE_TAG }} ./phase5/audit-service/
          docker push ${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-audit:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to Oracle OKE
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl for OKE
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install todo-app ./phase5/todo-app/ \
            -f ./phase5/todo-app/values-oracle.yaml \
            --set backend.image.tag=${{ env.IMAGE_TAG }} \
            --set frontend.image.tag=${{ env.IMAGE_TAG }} \
            --set notificationService.image.tag=${{ env.IMAGE_TAG }} \
            --set recurringTaskService.image.tag=${{ env.IMAGE_TAG }} \
            --set auditService.image.tag=${{ env.IMAGE_TAG }} \
            --set backend.image.repository=${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-backend \
            --set frontend.image.repository=${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-frontend \
            --set notificationService.image.repository=${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-notification \
            --set recurringTaskService.image.repository=${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-recurring \
            --set auditService.image.repository=${{ env.OCI_REGION }}.ocir.io/${{ env.OCI_TENANCY_NAMESPACE }}/todo-audit \
            --wait --timeout=300s

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get svc
          echo "Deployment complete!"
