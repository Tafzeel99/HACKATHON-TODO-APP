[project]
name = "notification-service"
version = "5.0.0"
description = "Phase 5 Notification Service - subscribes to Kafka reminders topic via Dapr Pub/Sub"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
