[project]
name = "audit-service"
version = "5.0.0"
description = "Phase 5 Audit Service - subscribes to task-events Kafka topic via Dapr Pub/Sub and stores activity log entries"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"